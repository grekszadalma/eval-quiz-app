services:
  db:
    build:
      context: ./database
    container_name: quiz-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: quiz-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3007/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: quiz-nginx-prod
    restart: unless-stopped
    ports:
      - "8087:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quiz-network

volumes:
  postgres_data:

networks:
  quiz-network:
    driver: bridge